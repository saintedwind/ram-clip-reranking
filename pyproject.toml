[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ram-clip-reranking"
version = "0.1.0"
description = "Reproducible image-tag ranking experiments with RAM and CLIP"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["tag_research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
